<!DOCTYPE html>
<html>
<head>
    <title>AWS Connection Test</title>
</head>
<body>
    <h2>AWS Lambda Connection Test</h2>
    <button onclick="testConnection()">Test AWS Connection</button>
    <div id="result" style="margin-top: 20px; padding: 10px; background: #f5f5f5;"></div>

    <script>
        async function testConnection() {
            document.getElementById('result').innerHTML = 'Testing...';
            
            try {
                const response = await fetch('/api/test-aws.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                
                const result = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
                
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
